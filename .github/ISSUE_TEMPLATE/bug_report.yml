name: Bug report
description: Something behaves differently from what it claims
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For anything security-related, please do **not** file here — see
        [SECURITY.md](../blob/master/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Engine (controller / verifier)
        - Widget (overlay, spotlight, observer)
        - Voice provider
        - Knowledge base / retrieval
        - Journeys
        - Console
        - Build / deploy
        - Other
    validations: { required: true }
  - type: textarea
    id: console
    attributes:
      label: Browser console output
      description: >
        Voice failures always log the real reason as
        `[minute-one] voice connection failed: …`. The panel deliberately shows
        the user something vaguer.
      render: text
  - type: input
    id: version
    attributes:
      label: Commit or version
