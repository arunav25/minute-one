name: Secret scan

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a key committed and later reverted is still leaked.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned. The action's default (8.24) predates the config syntax this
          # repository uses and silently ignores .gitleaks.toml.
          GITLEAKS_VERSION: 8.30.1
