name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      # The build also regenerates the embeddable bundle, so a broken SDK build
      # fails here rather than silently shipping a stale widget.
      - name: Build
        run: npm run build
        env:
          # The build must not depend on secrets. Anything requiring a key is
          # resolved at request time, not at build time.
          NEXT_TELEMETRY_DISABLED: "1"
