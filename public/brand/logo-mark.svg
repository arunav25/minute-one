<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Minute One">
  <title>Minute One</title>
  <!-- the gate: a closed ring, open only where the proof passes through -->
  <path d="M50.87 15.6 A25 25 0 1 1 40.55 8.51"
        fill="none" stroke="#16141F" stroke-width="4.2" stroke-linecap="round"/>
  <!-- the proof: a check that breaks out through the gap -->
  <path d="M21.5 33 L29.5 41 L48.9 8.3"
        fill="none" stroke="#7C5CFF" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
